global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# We don't need to scrape k6 directly in this mode, but we'll keep this
# in case the remote write doesn't work and we need to switch back
  - job_name: 'k6'
    static_configs:
      - targets: ['k6:6565']
    metrics_path: /metrics
